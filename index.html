<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딱만큼 프로토타입</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f2;--card:#fff;--soft:#eef4e6;--ink:#1f2a22;--mute:#6b7569;--g:#2f6b3f;--g2:#7fb85a;--warn:#f0931f;--red:#c23a2b;--redbg:#fde8e4;--line:#e3e6da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141a15;--card:#1d261f;--soft:#26332a;--ink:#eef2ea;--mute:#9aa596;--g:#7fcf8e;--g2:#7fb85a;--line:#2e3a31;--redbg:#3a2220}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141a15;--card:#1d261f;--soft:#26332a;--ink:#eef2ea;--mute:#9aa596;--g:#7fcf8e;--g2:#7fb85a;--line:#2e3a31;--redbg:#3a2220}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column}
.note{font-size:11px;text-align:center;color:var(--mute);padding:4px;background:var(--soft)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:26px;font-weight:900;color:var(--g);letter-spacing:-.5px}
h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-weight:700;font-size:14px}
.ing .e{font-size:34px;display:block}
.d{display:inline-block;background:var(--warn);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;margin-top:4px}
.d.ok{background:var(--g2)}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q button{background:var(--soft);border:0;border-radius:14px;padding:10px 2px;font:600 12px 'Noto Sans KR',sans-serif;color:var(--ink);cursor:pointer}
.q b{display:block;font-size:22px}
.btn{width:100%;background:var(--g);color:var(--bg);border:0;border-radius:99px;padding:14px;font:700 16px 'Noto Sans KR',sans-serif;cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--g);color:var(--g)}
.btn.s{padding:9px;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:9px 4px;font:600 13px 'Noto Sans KR',sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--g);color:var(--bg)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.red{background:var(--redbg);color:var(--red)}.grn{background:var(--soft);color:var(--g)}
.big{font-size:44px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--g2) calc(var(--p)*1%),var(--line) 0)}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:900 20px 'Noto Sans KR',sans-serif;font-style:normal}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--g2);opacity:.55;border-radius:6px 6px 0 0}.bars div:last-child{opacity:1;background:var(--g)}
.lab{display:flex;gap:6px;font-size:11px;color:var(--mute);text-align:center}.lab span{flex:1}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:transparent;color:var(--mute);font:600 11px 'Noto Sans KR',sans-serif;padding:6px 0;border-radius:12px;cursor:pointer}
nav button.on{color:var(--g);background:var(--soft)}nav span{display:block;font-size:20px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}.chk .grow{flex:1;font-weight:700}
.scan{height:150px;border-radius:14px;background:repeating-linear-gradient(135deg,#d9c9a8,#d9c9a8 10px,#cfbd98 10px,#cfbd98 20px);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:12px;font-weight:700;color:#5a4a2a}
.scan.go::after{content:"";position:absolute;left:0;right:0;height:3px;background:#5fd07a;box-shadow:0 0 12px #5fd07a;animation:sc 1.1s linear}
@keyframes sc{from{top:0}to{top:100%}}
@media (prefers-reduced-motion:reduce){.scan.go::after{animation:none}}
.opt{border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--g);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;max-width:90%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:var(--bg);border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:88%;overflow-y:auto}.x{border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}.lb{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.in{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 15px 'Noto Sans KR',sans-serif}.gr{display:grid;grid-template-columns:26px 64px 1fr;gap:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}.chip{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;font:700 16px 'Noto Sans KR',sans-serif;color:var(--ink);cursor:pointer}.chip.on{border-color:var(--g);background:var(--soft)}
</style>
</head>
<body>
<div id="app">
  <div class="note">프로토타입 · 샘플 데이터 (OCR·AI는 시뮬레이션)</div>
  <main id="main"></main>
  <nav id="nav"></nav><div id="ov"></div>
</div>
<script>
var S={tab:'home',view:'',sub:'prio',sit:0,buy:'one',range:'week',scanned:false,cart:0,saved:12400,kg:1.2,modal:null,gd:null,rs:[0,1,2],sq:{},sx:{},sd:{},sa:{},onb:0,ob:{meals:5,budget:50000,shop:'마트'},
items:[{n:'상추',e:'🥬',d:1},{n:'토마토',e:'🍅',d:2},{n:'두부',e:'🧊',d:3},{n:'딸기',e:'🍓',d:4},{n:'버섯',e:'🍄',d:4},{n:'계란',e:'🥚',d:9}],
rc:[{n:'우유',e:'🥛',q:'1개',d:5,p:2800,on:1},{n:'양파',e:'🧅',q:'1개',d:14,p:1200,on:1},{n:'대파',e:'🌿',q:'1단',d:6,p:1800,on:1}]};
var TABS=[['home','🏠','홈'],['stock','🧊','식재료'],['recipe','🍳','레시피'],['buy','🛒','구매추천'],['report','📊','리포트']];
var REC=[{t:'두부 토마토 볶음',m:'약 10분 · 아주 쉬움',e:'🍲',s:'집에서 식사',x:['토마토 두부 샐러드','토마토 계란볶음','두부 토마토 스튜']},
{t:'상추 토마토 샌드위치',m:'약 5분 · 아주 쉬움',e:'🥪',s:'시간이 부족해요',x:['토마토 주스','상추 계란말이']},
{t:'내일 외식 전 · 상추 토마토 샐러드',m:'약 5분 · 가볍게',e:'🥗',s:'외식 예정',x:['남은 두부 냉동 보관','딸기 먼저 먹기']}];
var $=function(s){return document.querySelector(s)};
var EM={'계란':'🥚','달걀':'🥚','우유':'🥛','양파':'🧅','대파':'🌿','당근':'🥕','감자':'🥔','사과':'🍎','바나나':'🍌','고기':'🥩','닭':'🍗','생선':'🐟','쌀':'🍚','빵':'🍞','치즈':'🧀','마늘':'🧄','버섯':'🍄','딸기':'🍓','토마토':'🍅','상추':'🥬','두부':'🧊','오이':'🥒','브로콜리':'🥦'};
function emo(n,f){for(var k in EM){if(n.indexOf(k)>=0)return EM[k]}return f||'🛒'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
var GD={'딸기':['냉장 (0~5°C)','씻지 않은 상태로 키친타월을 깔고 밀폐용기에 담아 보관하세요.','구매 후 2~3일 이내에 먹는 것이 가장 신선해요.','먹기 직전에 가볍게 씻으면 맛과 신선도를 더 오래 유지할 수 있어요.'],'상추':['냉장 (0~5°C)','씻지 않고 키친타월에 싸서 밀폐용기나 지퍼백에 세워 보관하세요.','약 5~7일','물기가 닿으면 빨리 무르니 젖었다면 키친타월로 닦아주세요.'],'토마토':['냉장 (익은 토마토)','꼭지를 아래로 향하게 하고 서로 닿지 않게 두세요.','냉장 약 5~7일','덜 익은 토마토는 실온에서 익힌 뒤 냉장하면 좋아요.'],'두부':['냉장 (0~5°C)','개봉한 두부는 깨끗한 물에 담가 밀폐용기에 보관하고 물을 매일 갈아주세요.','개봉 후 2~3일','오래 두려면 냉동할 수 있지만 식감이 달라져요.'],'버섯':['냉장 (0~5°C)','씻지 않고 키친타월로 싸서 용기나 종이봉투에 담으세요.','약 3~5일','먹기 직전에 씻어야 물러지지 않아요.'],'계란':['냉장 (0~5°C)','뾰족한 쪽이 아래로 가게 원래 포장 그대로 보관하세요.','포장에 적힌 소비기한까지','문 쪽보다 안쪽 칸이 온도가 안정적이에요.'],'우유':['냉장 (0~5°C)','뚜껑을 꼭 닫아 냉장고 안쪽 칸에 보관하세요.','개봉 후 2~3일 이내 섭취 권장','문 쪽은 온도 변화가 커서 안쪽이 더 좋아요.'],'양파':['서늘하고 통풍이 잘 되는 곳 (실온)','껍질째 망이나 바구니에 담아 보관하세요. 자른 양파는 밀폐해 냉장하세요.','통양파 약 2~4주','감자와 함께 두면 서로 빨리 상할 수 있어 따로 보관하세요.'],'대파':['냉장 (0~5°C) 또는 냉동','씻어서 물기를 말린 뒤 썰어 밀폐용기에 담거나 키친타월에 싸서 보관하세요.','냉장 약 1~2주','자주 쓰면 미리 썰어 냉동해 두면 편해요.'],'_':['냉장 (0~5°C)','밀폐용기에 담아 냉장 보관하세요.','포장에 적힌 소비기한을 확인하세요.','구매 후 가능한 한 빨리 드세요.']};
function openAdd(){S.modal={m:'add',n:'',q:'1개',d:5,err:''};render()}
function openEdit(i){var t=S.items[i];S.modal={m:'edit',i:i,n:t.n,q:t.q||'1개',d:t.d,err:''};render()}
function openGuide(i){S.gd=i;render()}
function closeM(){S.modal=null;S.gd=null;render()}
function saveM(){var m=S.modal,n=$('#f_n').value.trim(),q=$('#f_q').value.trim()||'1개',d=parseInt($('#f_d').value,10);m.n=n;m.q=q;m.d=$('#f_d').value;if(!n){m.err='식재료 이름을 입력해주세요.';render();return}if(isNaN(d)||d<0||d>365){m.err='남은 기간은 0~365일 사이로 입력해주세요.';render();return}if(m.m==='edit'){var t=S.items[m.i];t.n=n;t.q=q;t.d=d;t.e=emo(n,t.e)}else{S.items.push({n:n,e:emo(n),d:d,q:q});S.tab='stock';S.view='';S.sub='all'}S.modal=null;toast(m.m==='edit'?'수정했어요':'식재료를 추가했어요');render()}
function delM(){S.items.splice(S.modal.i,1);S.modal=null;toast('삭제했어요');render()}
function modalHtml(){if(S.gd!==null&&S.items[S.gd]){var t=S.items[S.gd],g=GD[t.n]||GD._,r=[['❄️','보관 온도',g[0]],['🥡','보관 방법',g[1]],['📅','보관 기간',g[2]]];return '<div class="ov" onclick="closeM()"><div class="modal" onclick="event.stopPropagation()"><div class="row sp"><h2 style="margin:0">📖 보관 방법</h2><button class="x" onclick="closeM()" aria-label="닫기">✕</button></div><div class="card row" style="margin-top:12px"><span class="big">'+t.e+'</span><div><b style="font-size:19px">'+esc(t.n)+'</b><div style="font-size:13px;color:var(--mute)">남은 기간 <b>'+t.d+'일</b></div><span class="tag '+(t.d<=3?'red':'grn')+'">'+(t.d<=3?'먼저 먹어요':'여유 있어요')+'</span></div></div><div class="card" style="padding:0;overflow:hidden"><div style="background:var(--soft);padding:10px 14px;font-weight:700">보관 가이드</div>'+r.map(function(x){return '<div class="gr"><span>'+x[0]+'</span><b>'+x[1]+'</b><span>'+x[2]+'</span></div>'}).join('')+'</div><div class="card" style="background:var(--soft)"><span class="tag grn">💡 팁</span><p style="font-size:14px;margin-top:6px">'+g[3]+'</p></div><p style="font-size:11px;color:var(--mute)">일반적인 보관 가이드예요. 제품에 표시된 소비기한과 보관 방법을 우선하세요.</p></div></div>'}var m=S.modal;if(!m)return '';return '<div class="ov" onclick="closeM()"><div class="modal" onclick="event.stopPropagation()"><div class="row sp"><h2 style="margin:0">'+(m.m==='edit'?'식재료 수정':'식재료 직접 추가')+'</h2><button class="x" onclick="closeM()" aria-label="닫기">✕</button></div><label class="lb" for="f_n">이름</label><input class="in" id="f_n" value="'+esc(m.n)+'" placeholder="예: 대파"><label class="lb" for="f_q">수량</label><input class="in" id="f_q" value="'+esc(m.q)+'" placeholder="예: 1개, 300g"><label class="lb" for="f_d">남은 소비기한 (일)</label><input class="in" id="f_d" type="number" inputmode="numeric" min="0" max="365" value="'+esc(m.d)+'">'+(m.err?'<p style="color:var(--red);font-size:13px;margin-top:8px">'+m.err+'</p>':'')+'<div class="row" style="margin-top:16px">'+(m.m==='edit'?'<button class="btn o" onclick="delM()">삭제</button>':'')+'<button class="btn" onclick="saveM()">'+(m.m==='edit'?'저장하기':'추가하기')+'</button></div></div></div>'}
var RD=[{g:[['두부','1/2모'],['토마토','2개']],b:'대파·소금·간장 약간',st:['두부는 한입 크기로 썰어 키친타월로 물기를 닦아요.','토마토는 먹기 좋게 썰어요.','팬에 기름을 두르고 두부를 노릇하게 구워요.','토마토와 간장 1작은술을 넣고 2~3분 볶아 마무리해요.']},{g:[['상추','4장'],['토마토','1개'],['계란','1개']],b:'식빵 2장·소금 약간',st:['계란을 풀어 소금을 넣고 팬에 부드럽게 익혀요.','토마토는 얇게 썰고 상추는 물기를 털어요.','식빵을 노릇하게 구워요.','빵 위에 상추, 토마토, 계란을 올리고 덮어요.']},{g:[['상추','5장'],['토마토','1개']],b:'올리브유·소금·후추 약간',st:['상추는 손으로 뜯어 찬물에 헹구고 물기를 빼요.','토마토는 한입 크기로 썰어요.','볼에 담고 올리브유, 소금, 후추를 넣어 가볍게 버무려요.']}];
function rdetail(){var r=REC[S.sit],d=RD[S.sit];return '<a onclick="S.view=&quot;&quot;;render()" style="cursor:pointer;color:var(--g);font-weight:700">‹ 추천으로</a><div class="card" style="margin-top:10px;text-align:center"><div class="big">'+r.e+'</div><h2>'+r.t+'</h2><span class="tag grn">'+r.m+'</span></div><div class="card"><b>재료</b>'+d.g.map(function(x){var has=S.items.some(function(i){return i.n===x[0]});return '<div class="chk"><span class="grow">'+x[0]+' <small style="color:var(--mute)">'+x[1]+'</small></span><span class="tag '+(has?'grn':'red')+'">'+(has?'보유 중':'구매 필요')+'</span></div>'}).join('')+'<p style="font-size:13px;color:var(--mute);margin-top:8px">기본 양념: '+d.b+'</p></div><div class="card"><b>만드는 방법</b><ol style="padding-left:20px;margin-top:8px;line-height:1.7;font-size:14px">'+d.st.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol></div><button class="btn" onclick="cooked()">✓ 요리 완료 · 사용한 식재료 차감</button><p style="font-size:11px;color:var(--mute);text-align:center;margin-top:6px">프로토타입에서는 사용한 식재료가 통째로 소비 처리돼요.</p>'}
